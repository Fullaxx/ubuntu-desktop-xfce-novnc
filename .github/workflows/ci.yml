# Builds the image, tests it (tests/novnc.sh) and pushes it to ghcr.io/fullaxx/ubuntu-desktop-xfce-novnc:
#   master -> :latest (the README's docker pull) and :26.04, the same image
# plus :<branch>-<short sha> for each build. "Run workflow" in the Actions tab does the same by hand for
# the branch it runs on (any other branch publishes only its <branch>-<short sha>).
#
# The image is built FROM ghcr.io/fullaxx/ubuntu-desktop-xfce:26.04 and copies noVNC from
# ghcr.io/fullaxx/novnc:resolute, as they are when it runs. After either publishes a new image,
# "Run workflow" on master rebuilds this one on it (a commit that was already built gets its
# <branch>-<short sha> pushed again).
name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # GITHUB_TOKEN is read-only by default in this repo; pushing to ghcr.io needs packages: write
    permissions:
      contents: read
      packages: write

    env:
      TEST_TAG: ubuntu-desktop-xfce-novnc:ci-test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # :latest and :26.04 from master, plus <branch>-<short sha> for each build
      # (by branch name, so :latest stays with master even if GitHub's default branch changes)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fullaxx/ubuntu-desktop-xfce-novnc
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=26.04,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix={{branch}}-

      # The base images as they are now: each FROM line's image (found as build.sh finds them),
      # looked up once, so that both builds below use the same digests
      - name: Look up the base images
        id: bases
        run: |
          CONTEXTS=""
          while read -r REF; do
            DIGEST=$(docker buildx imagetools inspect "${REF}" --format '{{.Manifest.Digest}}')
            if [[ "${DIGEST}" != sha256:* ]]; then
              echo "::error::Could not look up ${REF}"
              exit 1
            fi
            echo "${REF}: ${DIGEST}"
            CONTEXTS="${CONTEXTS}${REF}=docker-image://${REF}@${DIGEST}"$'\n'
          done < <(grep '^FROM' Dockerfile | awk '{print $2}')
          printf 'contexts<<EOF\n%sEOF\n' "${CONTEXTS}" >> "${GITHUB_OUTPUT}"

      # build-contexts: the base images looked up above, by digest (a build context named after
      # a FROM line's image replaces it); the GitHub Actions cache keeps unchanged layers
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: ${{ steps.bases.outputs.contexts }}
          load: true
          tags: ${{ env.TEST_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the desktop comes up behind noVNC
        run: tests/novnc.sh "${TEST_TAG}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build again, on the same base images: every layer comes from the build above,
      # so this pushes the image that was just tested
      - name: Push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: ${{ steps.bases.outputs.contexts }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
