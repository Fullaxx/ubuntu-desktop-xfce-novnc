; supervisord runs the desktop and noVNC side by side, each with its own project's start script,
; unchanged, and sends their output to docker logs (the Dockerfile's CMD starts it)

[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; The desktop: ubuntu-desktop-xfce's /app/app.sh runs its startup stages, then tiger.sh runs
; tigervncserver in the foreground until the desktop session ends (log out)
; (/etc/tigervnc/vncserver-config-mandatory keeps the VNC server on localhost, see the Dockerfile)
; Never restarted: when it ends, the shutdown listener stops the container,
; as ubuntu-desktop-xfce stops when its desktop session ends
[program:desktop]
command=/app/app.sh
priority=100
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; noVNC: the novnc image's start script (/app/novnc.sh) runs websockify, which serves the web client
; on port 8080 and connects it to the VNC server on localhost, port 5900 + VNCPORT (the display
; number tiger.sh starts it on: 1 by default, as in app.sh)
; Restarted if it ends: the desktop session carries on
[program:novnc]
command=/bin/bash -c 'export VNCADDR="127.0.0.1:$((5900 + ${VNCPORT:-1}))"; exec /app/novnc.sh'
priority=200
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Stops supervisord, and with it the container, when the desktop ends or a program can't start
; (its stdout is supervisord's event protocol, so only its stderr is logged)
[eventlistener:shutdown]
command=/app/shutdown.sh
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
